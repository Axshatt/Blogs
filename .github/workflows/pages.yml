name: Publish blog to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm ci
      - run: npm run build:pages
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
      # The project URL mounts the artifact at /Blogs/, while the custom domain
      # mounts it at /. Serve the same prefixed asset and navigation URLs on both.
      - name: Include project paths for the custom domain
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          cp -R out "$RUNNER_TEMP/project-site"
          mv "$RUNNER_TEMP/project-site" "out/$REPO_NAME"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
